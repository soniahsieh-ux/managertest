<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主管訓筆試互動刷題器</title>
<style>
:root{
  --bg:#F2F5F8;
  --panel:#FFFFFF;
  --panel-alt:#E9EEF2;
  --text:#16212E;
  --muted:#5B6B7A;
  --blue:#1F4E79;
  --blue-soft:#DCE6EE;
  --red:#B03A2E;
  --red-soft:#F4DED9;
  --green:#1B7A5E;
  --green-soft:#DCEEE6;
  --amber:#A96C16;
  --amber-soft:#F1E4CC;
  --border:#C9D2DB;
  --border-strong:#1F4E79;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121A22;
    --panel:#1B2530;
    --panel-alt:#22303C;
    --text:#E8EEF3;
    --muted:#9FB0C0;
    --blue:#8FBBE0;
    --blue-soft:#243444;
    --red:#E28A76;
    --red-soft:#3A2620;
    --green:#5FD9AE;
    --green-soft:#1C3830;
    --amber:#E0B15C;
    --border:#3A4956;
    --border-strong:#8FBBE0;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6;
  padding:0 0 3em;
}
h1,h2,h3{
  font-family:"Noto Serif TC",serif;
  color:var(--blue);
  margin:0 0 .4em;
}
button{
  font-family:inherit;
  cursor:pointer;
}
textarea, input[type=text]{
  font-family:inherit;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
}
.wrap{max-width:900px;margin:0 auto;padding:0 1em;}

/* masthead */
.masthead{
  background:var(--blue);
  color:#F2F5F8;
  padding:1.4em 1em 1.6em;
  border-bottom:4px double var(--red);
}
.masthead .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8em;}
.masthead h1{color:#F6F8FA;font-size:1.5em;margin:0;}
.masthead .subtitle{margin:.3em 0 0;font-size:.85em;color:#D7E3EC;}
.masthead-actions button{
  background:transparent;border:1px solid #D7E3EC;color:#F2F5F8;
  padding:.5em .9em;border-radius:2px;font-size:.85em;
}
.masthead-actions button:hover{background:rgba(255,255,255,.12);}

main.view{padding-top:1.4em;}

/* seal */
.seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.7em;height:1.7em;border:2px solid var(--red);color:var(--red);
  border-radius:50%;font-weight:700;font-family:"Noto Serif TC",serif;
  font-size:1em;margin-right:.4em;flex:none;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:2px;
  padding:1.1em 1.2em 1.3em;
  margin:0 0 1.4em;
}
.panel > h2{
  display:flex;align-items:center;font-size:1.15em;
  border-bottom:1px solid var(--border);padding-bottom:.5em;margin-bottom:.9em;
}

.module-grid, .sheet-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:.9em;
}
@media (max-width:600px){
  .module-grid, .sheet-grid{grid-template-columns:1fr;}
}
.mod-card, .sheet-card{
  border:1px solid var(--border);background:var(--panel-alt);
  padding:.9em 1em;border-radius:2px;
}
.mod-head, .sheet-head{display:flex;align-items:center;margin-bottom:.4em;}
.mod-head h3, .sheet-head h3{margin:0;font-size:1.02em;color:var(--text);}
.mod-meta{font-size:.85em;color:var(--muted);margin:.15em 0;}
.mod-meta.warn{color:var(--amber);}
.mod-actions{margin-top:.7em;display:flex;gap:.5em;flex-wrap:wrap;}

.btn{
  border:1px solid var(--blue);background:var(--panel);color:var(--blue);
  padding:.45em .8em;border-radius:2px;font-size:.9em;
}
.btn:hover:not(:disabled){background:var(--blue-soft);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.primary:hover{opacity:.9;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-soft);}

/* reference tables */
table.refTable{width:100%;border-collapse:collapse;margin:.6em 0 1.1em;font-size:.92em;}
.refTable th, .refTable td{border:1px solid var(--border-strong);padding:.5em .6em;text-align:left;vertical-align:top;}
.refTable th{background:var(--blue-soft);color:var(--blue);font-family:"Noto Serif TC",serif;}
.refTable .hi{color:var(--blue);font-weight:700;}
.ref-block h3{font-size:1em;border-left:4px solid var(--red);padding-left:.5em;margin:1.1em 0 .3em;}
.ref-block p{margin:.3em 0;font-size:.92em;color:var(--muted);}
@media (max-width:480px){
  .refTable, .refTable thead, .refTable tbody, .refTable tr, .refTable th, .refTable td{display:block;width:100%;}
  .refTable thead{display:none;}
  .refTable tr{border:1px solid var(--border-strong);border-radius:2px;padding:.3em .5em;margin-bottom:.6em;}
  .refTable td{border:none;border-bottom:1px solid var(--border);padding:.35em .1em;}
  .refTable td:last-child{border-bottom:none;}
  .refTable td::before{content:attr(data-th) "：";font-weight:700;color:var(--blue);display:block;}
}

/* quiz */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6em;font-size:.85em;color:var(--muted);}
.quiz-top .back{color:var(--blue);border:none;background:none;text-decoration:underline;padding:0;font-size:.95em;}
.quiz-q{font-size:1.05em;margin:.4em 0 1em;white-space:pre-wrap;}
.quiz-q .tag{display:inline-block;font-size:.72em;color:var(--amber);border:1px solid var(--amber);padding:.05em .5em;border-radius:2px;margin-right:.5em;vertical-align:middle;}

.choice-list{display:flex;flex-direction:column;gap:.5em;}
.choice-btn{
  text-align:left;padding:.6em .8em;border:1px solid var(--border);border-radius:2px;
  background:var(--panel);color:var(--text);font-size:.98em;
}
.choice-btn:hover:not(:disabled){border-color:var(--blue);}
.choice-btn.sel{border-color:var(--blue);background:var(--blue-soft);}
.choice-btn.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);}
.choice-btn.incorrect{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.choice-btn:disabled{cursor:default;}

.order-slots{display:flex;flex-wrap:wrap;gap:.5em;margin-bottom:.8em;}
.order-slot{
  padding:.5em .7em;border:1px dashed var(--border);border-radius:2px;font-size:.9em;min-width:6em;
  background:var(--panel-alt);color:var(--muted);
}
.order-slot.filled{border-style:solid;background:var(--panel);color:var(--text);}
.order-slot.correct{border-color:var(--green);color:var(--green);background:var(--green-soft);}
.order-slot.incorrect{border-color:var(--red);color:var(--red);background:var(--red-soft);}
.order-bank{display:flex;flex-wrap:wrap;gap:.5em;padding-top:.7em;border-top:1px solid var(--border);}
.order-item{padding:.5em .7em;border:1px solid var(--blue);border-radius:2px;background:var(--panel);color:var(--blue);font-size:.9em;}
.order-item:disabled{opacity:.35;}

.match-wrap{display:flex;gap:1em;}
.match-col{flex:1;display:flex;flex-direction:column;gap:.5em;}
@media (max-width:480px){.match-wrap{gap:.6em;}}
.match-btn{padding:.55em .7em;border:1px solid var(--border);border-radius:2px;background:var(--panel);color:var(--text);font-size:.9em;text-align:left;}
.match-btn.active{border-color:var(--blue);background:var(--blue-soft);}
.match-btn.matched{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);}
.match-btn.correct{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--green)!important;}
.match-btn.incorrect{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;}

.fill-input{width:100%;padding:.6em .7em;border-radius:2px;font-size:.98em;}
.fill-input.correct{border-color:var(--green);}
.fill-input.incorrect{border-color:var(--red);}

.quiz-explain{margin-top:1em;padding:.8em 1em;border-radius:2px;border:1px solid var(--border);font-size:.92em;}
.quiz-explain.ok{border-color:var(--green);background:var(--green-soft);}
.quiz-explain.no{border-color:var(--red);background:var(--red-soft);}
.quiz-explain .verdict{font-weight:700;margin-bottom:.3em;}
.quiz-explain.ok .verdict{color:var(--green);}
.quiz-explain.no .verdict{color:var(--red);}
.quiz-explain .ans-line{margin:.25em 0;}
.quiz-explain .src{font-size:.85em;color:var(--muted);margin-top:.4em;}

.quiz-actions{margin-top:1.2em;display:flex;gap:.6em;}

/* result */
.score-big{font-size:2em;color:var(--blue);font-family:"Noto Serif TC",serif;margin:.2em 0;}
.wrong-list{list-style:none;margin:.6em 0;padding:0;}
.wrong-list li{padding:.5em .2em;border-bottom:1px solid var(--border);font-size:.92em;}

/* exam sheet */
.sheet-case{background:var(--amber-soft);border-left:4px solid var(--amber);padding:.8em 1em;margin-bottom:1em;font-size:.95em;}
.field-row{display:flex;flex-wrap:wrap;gap:.6em;margin-bottom:.9em;}
.field-row label{flex:1 1 200px;font-size:.88em;color:var(--muted);display:flex;flex-direction:column;gap:.3em;}
.field-row input[type=text]{padding:.5em .6em;border-radius:2px;}
.form-block{margin-bottom:1em;}
.form-block > .label{font-weight:700;color:var(--blue);font-size:.92em;margin-bottom:.3em;}
.form-block .hint{font-size:.8em;color:var(--muted);margin-bottom:.35em;}
.form-block textarea{width:100%;padding:.6em .7em;border-radius:2px;font-size:.95em;min-height:5em;resize:vertical;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9em;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;gap:.6em;align-items:flex-start;padding:.45em .2em;border-bottom:1px solid var(--border);font-size:.92em;}
.checklist input{margin-top:.25em;}
.check-stat{font-size:.9em;color:var(--blue);margin:.6em 0;font-weight:700;}
</style>
</head>
<body>
<div class="masthead">
  <div class="wrap">
    <div>
      <h1>主管訓筆試互動刷題器</h1>
      <p class="subtitle">目標設定與工作計劃表・授權事前準備表・溝通協調・教練教導・授權後　－　架構默寫與情境辨識練習</p>
    </div>
    <div class="masthead-actions">
      <button id="btn-reset" type="button">重設進度</button>
    </div>
  </div>
</div>

<div class="wrap">

<main id="view-home" class="view">
  <section class="panel">
    <h2><span class="seal">練</span>六大模組</h2>
    <div class="module-grid" id="module-grid"></div>
  </section>

  <section class="panel">
    <h2><span class="seal">卷</span>模擬筆試（三張單）</h2>
    <div class="sheet-grid" id="sheet-grid"></div>
  </section>

  <section class="panel">
    <h2><span class="seal">典</span>教材速查</h2>
    <div id="reference"></div>
  </section>
</main>

<main id="view-quiz" class="view" hidden>
  <section class="panel">
    <div class="quiz-top">
      <button class="back" type="button" id="quiz-back">← 返回首頁</button>
      <span id="quiz-progress"></span>
    </div>
    <div class="quiz-q" id="quiz-question-text"></div>
    <div id="quiz-question-body"></div>
    <div class="quiz-explain" id="quiz-explain" hidden></div>
    <div class="quiz-actions">
      <button class="btn primary" id="quiz-submit" type="button">送出答案</button>
      <button class="btn primary" id="quiz-next" type="button" hidden>下一題</button>
    </div>
  </section>
</main>

<main id="view-result" class="view" hidden>
  <section class="panel">
    <h2><span class="seal">果</span>本次成績</h2>
    <div class="score-big" id="result-score"></div>
    <div id="result-wrongwrap"></div>
    <div class="quiz-actions">
      <button class="btn primary" id="result-retry-wrong" type="button">只重刷錯的</button>
      <button class="btn" id="result-retry-all" type="button">整個模組再刷一次</button>
      <button class="btn" id="result-home" type="button">返回首頁</button>
    </div>
  </section>
</main>

<main id="view-sheet" class="view" hidden>
  <section class="panel">
    <div class="quiz-top">
      <button class="back" type="button" id="sheet-back">← 返回首頁</button>
      <span></span>
    </div>
    <div id="sheet-body"></div>
  </section>
</main>

</div>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var STORAGE_KEY = "sgxt_progress_v1";
var DRAFT_KEY = "sgxt_drafts_v1";

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    var data = JSON.parse(raw);
    return data && typeof data === "object" ? data : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, data){
  try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){ /* ignore */ }
}

var progress = loadJSON(STORAGE_KEY, {everCorrect:{}, wrong:{}});
if(!progress.everCorrect) progress.everCorrect = {};
if(!progress.wrong) progress.wrong = {};
function saveProgress(){ saveJSON(STORAGE_KEY, progress); }

var drafts = loadJSON(DRAFT_KEY, {});
function saveDrafts(){ saveJSON(DRAFT_KEY, drafts); }

/* ---------- fill-in normalize ---------- */
function normalizeFill(s){
  return (s || "").toString().trim().toLowerCase()
    .replace(/[\s　，。、；：！？.,;:!?()（）「」『』\-—_\/\\／·~`'"“”‘’&＆]/g, "");
}
function checkFill(q, val){
  var norm = normalizeFill(val);
  if(!norm) return false;
  var pool = [q.answer].concat(q.alt || []).map(normalizeFill);
  return pool.indexOf(norm) !== -1;
}

/* ============================================================
   題庫
   ============================================================ */
var M1 = [
 {id:"m1-1", type:"single", tag:"默寫",
  q:"溝通協調思考階梯第一階「Position」的中文名稱是？",

  explain:"思考階梯第一階為 Position（明白自己的位置），要先釐清自己的角色與期望溝通後的結果，再往下一階走。", src:"溝通協調思考階梯"},
 {id:"m1-2", type:"single", tag:"默寫",
  q:"思考階梯第二階「Empathy」的中文名稱是？",
  choices:["訊息的價值","同理心思考","明白自己的位置","互動的過程"], answer:1,
  explain:"Empathy＝同理心思考，重點是先想清楚溝通對象、對方擔心及在意的事、對方的期望。", src:"溝通協調思考階梯"},
 {id:"m1-3", type:"single", tag:"默寫",
  q:"思考階梯第三階「Values」的中文名稱是？",
  choices:["互動的過程","明白自己的位置","訊息的價值","同理心思考"], answer:2,
  explain:"Values＝訊息的價值，要整理出這次溝通的重點與內容，不能想到什麼講什麼。", src:"溝通協調思考階梯"},
 {id:"m1-4", type:"single", tag:"默寫",
  q:"思考階梯第四階「Interaction」的中文名稱是？",
  choices:["互動的過程","訊息的價值","同理心思考","明白自己的位置"], answer:0,
  explain:"Interaction＝互動的過程，實際溝通時要善用同理心溝通、詢問、邀請與引導。", src:"溝通協調思考階梯"},
 {id:"m1-5", type:"order", tag:"排序",
  q:"請依溝通協調思考階梯，由第一階到第四階依序排列。",
  items:["Values 訊息的價值","Position 明白自己的位置","Interaction 互動的過程","Empathy 同理心思考"],
  answer:[1,3,0,2],
  explain:"正確順序為：Position 明白自己的位置 → Empathy 同理心思考 → Values 訊息的價值 → Interaction 互動的過程。先定位自己，再理解對方，才能決定訊息重點與互動方式。", src:"溝通協調思考階梯"},
 {id:"m1-6", type:"match", tag:"配對",

  answer:{"0":1,"1":3,"2":0,"3":2},
  explain:"Position 對應「我的角色／期望溝通後的結果」；Empathy 對應「溝通對象／對方擔心及在意／對方期望」；Values 對應「溝通重點／內容」；Interaction 對應「善用同理心溝通／詢問、邀請與引導」。", src:"溝通協調思考階梯"},
 {id:"m1-7", type:"fill", tag:"默寫",
  q:"請默寫思考階梯「Position」階段的關鍵問題（逐項寫出）。",
  answer:"我的角色／期望溝通後的結果",
  alt:["我的角色/期望溝通後的結果","期望溝通後的結果／我的角色","我的角色、期望溝通後的結果"],

  q:"請默寫思考階梯「Empathy」階段的關鍵問題（逐項寫出）。",

  explain:"Empathy 階段要想清楚溝通對象是誰、對方擔心及在意什麼、對方的期望是什麼。", src:"溝通協調思考階梯"},
 {id:"m1-9", type:"fill", tag:"默寫",

  explain:"Values 階段的關鍵問題就是這次溝通的重點與內容。", src:"溝通協調思考階梯"},
 {id:"m1-10", type:"fill", tag:"默寫",
  q:"請默寫思考階梯「Interaction」階段的關鍵問題（逐項寫出）。",

  explain:"Interaction 階段強調善用同理心溝通，並透過詢問、邀請與引導來互動。", src:"溝通協調思考階梯"},
 {id:"m1-11", type:"multi", tag:"複選",

  choices:["傾聽","邀請分享","確認彼此認知","三明治法則","一開口就直接下結論","打斷對方發言以節省時間"],
  answer:[0,1,2,3],
  explain:"口試溝通協調注意事項為：傾聽、邀請分享、確認彼此認知、三明治法則。直接下結論、打斷對方都不是建議做法。", src:"溝通協調（口試注意事項）"},
 {id:"m1-12", type:"single", tag:"情境",
  q:"情境：報表交接給一位印尼組員之前，你先思考「這位組員可能會擔心什麼、在意什麼、希望我怎麼處理」——這最貼近思考階梯的哪一階段？",
  choices:["Position 明白自己的位置","Empathy 同理心思考","Values 訊息的價值","Interaction 互動的過程"], answer:1,

];

var M2 = [

function clearNode(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function ce(tag, className, text){
  var e = document.createElement(tag);
  if(className) e.className = className;
  if(text != null) e.textContent = text;
  return e;
}

}

function refTableSection(title, rows, headers){
  var block = ce("div","ref-block");
  block.appendChild(ce("h3", null, title));
  var table = document.createElement("table");
  table.className = "refTable";
  var thead = document.createElement("thead");
  var trh = document.createElement("tr");
  headers.forEach(function(h){ trh.appendChild(ce("th", null, h)); });
  thead.appendChild(trh);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function(row){
    var tr = document.createElement("tr");
    row.forEach(function(cell, i){
      var td = ce("td", null, cell);
      td.setAttribute("data-th", headers[i]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  block.appendChild(table);
  return block;
}

/* ============================================================
   作答元件（依題型渲染／收答／評分）
   ============================================================ */
function renderQuestionBody(q, container){
  clearNode(container);
  container.dataset.locked = "0";
  var state = {};

  if(q.type === "single" || q.type === "multi"){
    state.selected = {};
    var list = ce("div","choice-list");
    q.choices.forEach(function(choice, i){
      var btn = ce("button","choice-btn", choice);
      btn.type = "button";
      btn.addEventListener("click", function(){
        if(container.dataset.locked === "1") return;
        if(q.type === "single"){
          state.selected = {};
          state.selected[i] = true;
          Array.prototype.forEach.call(list.querySelectorAll(".choice-btn"), function(b){ b.classList.remove("sel"); });
          btn.classList.add("sel");
        } else {
          if(state.selected[i]){ delete state.selected[i]; btn.classList.remove("sel"); }
          else { state.selected[i] = true; btn.classList.add("sel"); }
        }
      });
      list.appendChild(btn);
    });
    container.appendChild(list);

  } else if(q.type === "order"){
    state.chosen = [];
    var slots = ce("div","order-slots");
    var bank = ce("div","order-bank");
    function refreshOrder(){
      clearNode(slots);
      state.chosen.forEach(function(itemIdx, slotPos){
        var s = ce("button","order-slot filled", (slotPos+1) + ". " + q.items[itemIdx]);
        s.type = "button";
        s.addEventListener("click", function(){
          if(container.dataset.locked === "1") return;
          state.chosen.splice(slotPos,1);
          refreshOrder();
        });
        slots.appendChild(s);
      });
      for(var i=state.chosen.length; i<q.items.length; i++){
        slots.appendChild(ce("div","order-slot empty", (i+1) + ". ？"));
      }
      Array.prototype.forEach.call(bank.querySelectorAll(".order-item"), function(b){
        var idx = Number(b.getAttribute("data-idx"));
        b.disabled = state.chosen.indexOf(idx) !== -1;
      });
    }
    q.items.forEach(function(item, i){
      var b = ce("button","order-item", item);
      b.type = "button";
      b.setAttribute("data-idx", String(i));
      b.addEventListener("click", function(){
        if(container.dataset.locked === "1") return;
        if(state.chosen.indexOf(i) !== -1) return;
        state.chosen.push(i);
        refreshOrder();
      });
      bank.appendChild(b);
    });
    container.appendChild(slots);
    container.appendChild(bank);
    refreshOrder();

  } else if(q.type === "match"){
    state.pairs = {};
    state.activeLeft = null;
    var wrap2 = ce("div","match-wrap");
    var leftCol = ce("div","match-col");
    var rightCol = ce("div","match-col");
    function refreshMatch(){
      Array.prototype.forEach.call(leftCol.querySelectorAll(".match-btn"), function(b){
        var idx = Number(b.getAttribute("data-idx"));
        b.classList.toggle("active", state.activeLeft === idx);
        b.classList.toggle("matched", state.pairs.hasOwnProperty(idx));
      });
      var usedRight = {};
      for(var k in state.pairs){ usedRight[state.pairs[k]] = true; }
      Array.prototype.forEach.call(rightCol.querySelectorAll(".match-btn"), function(b){
        var idx = Number(b.getAttribute("data-idx"));
        b.classList.toggle("matched", !!usedRight[idx]);
      });
    }
    q.left.forEach(function(txt, i){
      var b = ce("button","match-btn", txt);
      b.type="button"; b.setAttribute("data-idx", String(i));
      b.addEventListener("click", function(){
        if(container.dataset.locked === "1") return;
        if(state.pairs.hasOwnProperty(i)){ delete state.pairs[i]; state.activeLeft=null; refreshMatch(); return; }
        state.activeLeft = i;
        refreshMatch();
      });
      leftCol.appendChild(b);
    });
    q.right.forEach(function(txt, i){
      var b = ce("button","match-btn", txt);
      b.type="button"; b.setAttribute("data-idx", String(i));
      b.addEventListener("click", function(){
        if(container.dataset.locked === "1") return;
        if(state.activeLeft === null) return;
        for(var kk in state.pairs){ if(state.pairs[kk] === i) delete state.pairs[kk]; }
        state.pairs[state.activeLeft] = i;
        state.activeLeft = null;
        refreshMatch();
      });
      rightCol.appendChild(b);
    });
    wrap2.appendChild(leftCol); wrap2.appendChild(rightCol);
    container.appendChild(wrap2);
    refreshMatch();

  } else if(q.type === "fill"){
    var input = document.createElement("textarea");
    input.className = "fill-input";
    input.rows = 2;
    input.placeholder = "請輸入答案…";
    container.appendChild(input);
    state.input = input;
  }
  return state;
}

function gradeQuestion(q, state){
  if(q.type === "single"){
    var selKeys = Object.keys(state.selected).map(Number);
    return selKeys.length === 1 && selKeys[0] === q.answer;
  }
  if(q.type === "multi"){
    var sel = Object.keys(state.selected).map(Number).sort(function(a,b){return a-b;});
    var ans = q.answer.slice().sort(function(a,b){return a-b;});
    if(sel.length !== ans.length) return false;
    for(var i=0;i<sel.length;i++){ if(sel[i] !== ans[i]) return false; }
    return true;
  }
  if(q.type === "order"){
    if(state.chosen.length !== q.answer.length) return false;
    for(var j=0;j<q.answer.length;j++){ if(state.chosen[j] !== q.answer[j]) return false; }
    return true;
  }
  if(q.type === "match"){
    var leftCount = q.left.length;
    for(var li=0; li<leftCount; li++){
      if(state.pairs[li] !== q.answer[String(li)]) return false;
    }
    return true;
  }
  if(q.type === "fill"){
    return checkFill(q, state.input.value);
  }
  return false;
}

function revealAnswer(q, container, state){
  container.dataset.locked = "1";
  if(q.type === "single" || q.type === "multi"){
    var ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
    var ansSet = {};
    ansArr.forEach(function(a){ ansSet[a]=true; });
    Array.prototype.forEach.call(container.querySelectorAll(".choice-btn"), function(b,i){
      var isAns = !!ansSet[i];
      var isSel = !!state.selected[i];
      if(isAns) b.classList.add("correct");
      if(isSel && !isAns) b.classList.add("incorrect");
      b.disabled = true;
    });
  } else if(q.type === "order"){
    Array.prototype.forEach.call(container.querySelectorAll(".order-slot.filled"), function(b,i){
      var ok = state.chosen[i] === q.answer[i];
      b.classList.add(ok ? "correct" : "incorrect");
    });
    Array.prototype.forEach.call(container.querySelectorAll(".order-item"), function(b){ b.disabled = true; });
  } else if(q.type === "match"){
    Array.prototype.forEach.call(container.querySelectorAll(".match-btn"), function(b){ b.style.pointerEvents = "none"; });
    var leftBtns = container.querySelectorAll(".match-col")[0].querySelectorAll(".match-btn");
    Array.prototype.forEach.call(leftBtns, function(b,i){
      var ok = state.pairs[i] === q.answer[String(i)];
      b.classList.add(ok ? "correct" : "incorrect");
    });
  } else if(q.type === "fill"){
    state.input.disabled = true;
    var ok2 = checkFill(q, state.input.value);
    state.input.classList.add(ok2 ? "correct" : "incorrect");
  }
}

function answerSummaryText(q){
  if(q.type === "single") return q.choices[q.answer];
  if(q.type === "multi") return q.answer.map(function(i){ return q.choices[i]; }).join("、");
  if(q.type === "order") return q.answer.map(function(i){ return q.items[i]; }).join(" → ");
  if(q.type === "match"){
    var parts = [];
    q.left.forEach(function(txt,i){ parts.push(txt + "＝" + q.right[q.answer[String(i)]]); });
    return parts.join("；");
  }
  if(q.type === "fill") return q.answer;
  return "";
}

/* ============================================================
   測驗流程
   ============================================================ */
var session = null;

function startQuiz(mod, mode){
  var queue;
  if(mode === "wrong"){
    queue = mod.qs.filter(function(q){ return !!progress.wrong[q.id]; });
    if(queue.length === 0) return;
  } else {
    var wrongOnes = mod.qs.filter(function(q){ return !!progress.wrong[q.id]; });
    var rest = mod.qs.filter(function(q){ return !progress.wrong[q.id]; });
    queue = wrongOnes.concat(rest);
  }
  session = {mod:mod, queue:queue, idx:0, correctCount:0, wrongList:[]};
  showView("quiz");
  renderCurrentQuestion();
}

function startCustomQuiz(mod, queue){
  if(!queue || queue.length === 0) return;
  session = {mod:mod, queue:queue, idx:0, correctCount:0, wrongList:[]};
  showView("quiz");
  renderCurrentQuestion();
}

function renderCurrentQuestion(){
  var q = session.queue[session.idx];
  $("quiz-progress").textContent = session.mod.name + "　第 " + (session.idx+1) + " / " + session.queue.length + " 題";
  var qtext = $("quiz-question-text");
  clearNode(qtext);
  var tag = ce("span","tag", q.tag || q.type);
  qtext.appendChild(tag);
  qtext.appendChild(document.createTextNode(q.q));

  var body = $("quiz-question-body");
  var state = renderQuestionBody(q, body);

  var explainEl = $("quiz-explain");
  explainEl.hidden = true;
  clearNode(explainEl);
  explainEl.className = "quiz-explain";

  var submitBtn = $("quiz-submit");
  var nextBtn = $("quiz-next");
  submitBtn.hidden = false;
  nextBtn.hidden = true;

  submitBtn.onclick = function(){
    var ok = gradeQuestion(q, state);
    revealAnswer(q, body, state);
    if(ok){
      progress.everCorrect[q.id] = true;
      delete progress.wrong[q.id];
      session.correctCount++;
    } else {
      progress.wrong[q.id] = true;
      session.wrongList.push(q);
    }
    saveProgress();

    explainEl.hidden = false;
    explainEl.className = "quiz-explain " + (ok ? "ok" : "no");
    explainEl.appendChild(ce("div","verdict", ok ? "答對了" : "答錯了"));
    if(!ok){
      explainEl.appendChild(ce("div","ans-line", "正確答案：" + answerSummaryText(q)));
    }
    explainEl.appendChild(ce("div","ans-line", q.explain));
    explainEl.appendChild(ce("div","src", "出處：" + q.src));

    submitBtn.hidden = true;
    nextBtn.hidden = false;
  };

  nextBtn.onclick = function(){
    session.idx++;
    if(session.idx >= session.queue.length){ finishSession(); }
    else { renderCurrentQuestion(); }
  };
}

function finishSession(){
  showView("result");
  var total = session.queue.length;
  var correct = session.correctCount;
  $("result-score").textContent = correct + " / " + total;

  var wrap = $("result-wrongwrap");
  clearNode(wrap);
  if(session.wrongList.length === 0){
    wrap.appendChild(ce("p", null, "本次全部答對，太厲害了！"));
  } else {
    wrap.appendChild(ce("h3", null, "本次錯題清單"));
    var ul = ce("ul","wrong-list");
    session.wrongList.forEach(function(q){
      ul.appendChild(ce("li", null, "[" + (q.tag||q.type) + "] " + q.q));
    });
    wrap.appendChild(ul);
  }

  var retryWrongBtn = $("result-retry-wrong");
  retryWrongBtn.disabled = session.wrongList.length === 0;
  retryWrongBtn.onclick = function(){
    startCustomQuiz(session.mod, session.wrongList.slice());
  };
  $("result-retry-all").onclick = function(){
    startQuiz(session.mod, "all");
  };
  $("result-home").onclick = function(){
    buildHome();
    showView("home");
  };

  buildModuleGrid();
}

$("quiz-back").addEventListener("click", function(){
  buildHome();
  showView("home");
});

/* ============================================================
   模擬筆試單
   ============================================================ */
function persistField(el, key){
  if(drafts[key] !== undefined){
    if(el.type === "checkbox") el.checked = !!drafts[key];
    else el.value = drafts[key];
  }
  var evtName = el.type === "checkbox" ? "change" : "input";
  el.addEventListener(evtName, function(){
    drafts[key] = el.type === "checkbox" ? el.checked : el.value;
    saveDrafts();
  });
}

function fieldRow(items){
  var row = ce("div","field-row");
  items.forEach(function(item){
    var label = document.createElement("label");
    label.appendChild(document.createTextNode(item.label));
    var input = document.createElement("input");
    input.type = "text";
    persistField(input, item.key);
    label.appendChild(input);
    row.appendChild(label);
  });
  return row;
}

function formBlock(labelText, hintText, key, rows){
  var block = ce("div","form-block");
  block.appendChild(ce("div","label", labelText));
  if(hintText) block.appendChild(ce("div","hint", hintText));
  var ta = document.createElement("textarea");
  ta.rows = rows || 4;
  persistField(ta, key);
  block.appendChild(ta);
  return block;
}

function checklistBlock(title, items, keyPrefix){
  var block = ce("div","form-block");
  block.appendChild(ce("div","label", title));
  var stat = ce("div","check-stat","");
  var ul = ce("ul","checklist");
  function updateStat(){
    var total = items.length;
    var checkedCount = Array.prototype.filter.call(ul.querySelectorAll("input"), function(cb){ return cb.checked; }).length;
    stat.textContent = "已勾選 " + checkedCount + " / " + total;
  }
  items.forEach(function(text, i){
    var li = document.createElement("li");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    persistField(cb, keyPrefix + "-" + i);
    cb.addEventListener("change", updateStat);
    li.appendChild(cb);
    li.appendChild(ce("span", null, text));
    ul.appendChild(li);
  });
  block.appendChild(stat);
  block.appendChild(ul);
  updateStat();
  return block;
}
